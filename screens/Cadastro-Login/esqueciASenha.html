<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vem Ser Técnico - Cadastro</title>
    <link rel="stylesheet" href="/css/cadastro.css">
</head>

<body>

    <main id="telaCadastro">
        <section id="ladoEsquerdoCadastro">
            <img
                src="/asssets/LogoTelaCadastro.png"
                alt="Logo do Website - Vem Ser Técnico"
                id="LogoTelaCadastro"
            >
        </section>

        <section id="ladoDireitoCadastro">
            <div id="containerCadastro">
                <form id="formTelaCadastro">
                    <h2>Recuperar Senha</h2>
                    <label for="nome">E-mail</label>
                    <input
                        type="email"
                        id="emailInputEsqueciASenha"
                        name="email"
                    >
                    <label for="cpf">Nova Senha</label>
                    <input
                        type="password"
                        id="novaSenhaInputEsqueciASenha"
                        name="novaSenha"
                    >
                    <label for="email">Confirmar Senha</label>
                    <input
                        type="password"
                        id="confNovaSenhaInputEsqueciASenha"
                        name="confSenha"
                    >
                    <label for="senha">Código de Verificação</label>
                    <input
                        type="text"
                        id="codigoVerificInputEsqueciASenha"
                        name="codSenha"
                    >
                    <button type="submit">Próximo</button>
                </form>
                <div id="linksCadastro">
                    <span>Já tem uma conta? <a href="/screens/Cadastro-Login/login.html">Faça o login</a></span>
                </div>
            </div>
        </section>
    </main>

</body>
</html>

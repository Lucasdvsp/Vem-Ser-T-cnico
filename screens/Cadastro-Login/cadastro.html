<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vem Ser Técnico - Cadastro</title>
    <link rel="stylesheet" href="/css/cadastro.css">
</head>

<body>

    <main id="telaCadastro">
        <section id="ladoEsquerdoCadastro">
            <img
                src="/asssets/LogoTelaCadastro.png"
                alt="Logo do Website - Vem Ser Técnico"
                id="LogoTelaCadastro"
            >
        </section>

        <section id="ladoDireitoCadastro">
            <div id="containerCadastro">
                <form id="formTelaCadastro">
                    <h2>Cadastre sua conta</h2>
                    <label for="nome">Nome completo</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                    >
                    <label for="cpf">CPF</label>
                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                    >
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                    >
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                    >
                    <button type="submit">Próximo</button>
                    <a href="/screens/Cadastro-Login/cadastro2.html">oiii</a>
                </form>
                <div id="linksCadastro">
                    <span>Já tem uma conta? <a href="/screens/Cadastro-Login/login.html">Faça o login</a></span>
                </div>
            </div>
        </section>
    </main>

</body>
</html>


<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vem Ser Técnico - Instituições</title>

    <link rel="stylesheet" href="/css/navBarPlataforma.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="/css/instituicoes.css">
</head>

<body>

    <main id="telaInstituicoes">

        <!-- NAVBAR -->
        <nav-bar></nav-bar>

        <!-- BANNER -->
        <section class="bannerInstituicoes">
            <img
                src="/asssets/BannerInstituicoes.png"
                alt="Materiais escolares sobre uma superfície vermelha"
            >
        </section>

        <!-- CONTEÚDO -->
        <div class="conteudoInstituicoes">

            <!-- PESQUISA -->
            <section class="areaPesquisa">

                <div class="barraPesquisaInstituicoes">

                    <input
                        type="search"
                        id="pesquisaInstituicoes"
                        placeholder="Pesquisar instituição"
                        aria-label="Pesquisar instituições"
                    >

                    <button
                        type="button"
                        id="btnPesquisarInstituicao"
                        aria-label="Pesquisar"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="10.8" cy="10.8" r="7.5"></circle>
                            <path d="m16.3 16.3 5 5"></path>
                        </svg>
                    </button>

                </div>

            </section>

            <!-- MENSAGEM DE ESTADO -->
            <p
                id="mensagemInstituicoes"
                role="status"
                aria-live="polite"
                hidden
            ></p>

            <!-- FATECS -->
            <section class="secaoInstituicoes" id="secaoFatecs">

                <div class="tituloSecaoInstituicoes">
                    <h2>FATECs</h2>
                </div>

                <div class="carrosselInstituicoes">

                    <button
                        class="setaCarrossel setaAnterior"
                        type="button"
                        aria-label="Instituições anteriores"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="m15 18-6-6 6-6"></path>
                        </svg>
                    </button>

                    <!-- CARDS GERADOS PELA API -->
                    <div
                        class="listaInstituicoes"
                        id="listaFatecs"
                    ></div>

                    <button
                        class="setaCarrossel setaProxima"
                        type="button"
                        aria-label="Próximas instituições"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="m9 18 6-6-6-6"></path>
                        </svg>
                    </button>

                </div>

            </section>

            <!-- ETECS -->
            <section class="secaoInstituicoes" id="secaoEtecs">

                <div class="tituloSecaoInstituicoes">
                    <h2>ETECs</h2>
                </div>

                <div class="carrosselInstituicoes">

                    <button
                        class="setaCarrossel setaAnterior"
                        type="button"
                        aria-label="Instituições anteriores"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="m15 18-6-6 6-6"></path>
                        </svg>
                    </button>

                    <!-- CARDS GERADOS PELA API -->
                    <div
                        class="listaInstituicoes"
                        id="listaEtecs"
                    ></div>

                    <button
                        class="setaCarrossel setaProxima"
                        type="button"
                        aria-label="Próximas instituições"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="m9 18 6-6-6-6"></path>
                        </svg>
                    </button>

                </div>

            </section>

        </div>

        <!-- FOOTER -->
        <site-footer></site-footer>

    </main>

    <!-- COMPONENTES -->
    <script src="/components/navBar.js"></script>
    <script src="/components/footercomponente.js"></script>

    <!-- API E FUNCIONALIDADES DAS INSTITUIÇÕES -->
    <script type="module" src="/scripts/instituicoes.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vem Ser Técnico - Exercícios</title>

    <link rel="stylesheet" href="/css/navBarPlataforma.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="/css/exercicios.css">
</head>

<body>

    <main id="telaExercicios">

        <!-- NAVBAR -->
        <nav-bar></nav-bar>

        <!-- CONTEÚDO -->
        <div class="conteudoExercicios">

            <header class="cabecalhoExercicios">
                <h1>Exercícios</h1>
                <p>Pratique os conteúdos separados por matéria.</p>
            </header>

            <!-- PESQUISA E FILTRO DE MATÉRIA -->
            <section class="areaControlesExercicios" aria-label="Filtros de exercícios">

                <div class="barraPesquisaExercicios">
                    <input
                        type="search"
                        id="pesquisaExercicios"
                        placeholder="Pesquisar exercício"
                        aria-label="Pesquisar exercícios"
                    >
                    <button
                        type="button"
                        id="btnPesquisarExercicio"
                        aria-label="Pesquisar"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="10.8" cy="10.8" r="7.5"></circle>
                            <path d="m16.3 16.3 5 5"></path>
                        </svg>
                    </button>
                </div>

                <div class="filtroMaterias" id="filtroMaterias" role="tablist" aria-label="Filtrar por matéria">
                    <button type="button" class="btnMateria ativo" data-materia="todas">
                        Todas
                    </button>
                </div>

            </section>

            <!-- MENSAGEM DE ESTADO -->
            <p
                id="mensagemExercicios"
                role="status"
                aria-live="polite"
                hidden
            ></p>

            <!-- SEÇÕES SEPARADAS POR MATÉRIA -->
            <div id="listaSecoesExercicios"></div>

        </div>

        <!-- FOOTER -->
        <site-footer></site-footer>

    </main>

    <!-- COMPONENTES -->
    <script src="/components/navBar.js"></script>
    <script src="/components/footercomponente.js"></script>

    <!-- FUNCIONALIDADE -->
    <script type="module" src="/scripts/exercicios.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vem Ser Técnico - Simulados</title>

    <link rel="stylesheet" href="/css/navBarPlataforma.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/simulados.css">
</head>

<body>

<main id="telaSimulados">

    <!-- NAVBAR -->
    <nav-bar></nav-bar>

    <!-- BANNER -->
    <section id="bannerHome">
        <img
            src="/asssets/BannerSimulados.png"
            alt="Banner de boas-vindas ao Vem Ser Técnico"
        >
    </section>

    <!-- CONTEÚDO -->
    <div class="conteudoHome">

        <!-- PESQUISA E FILTROS -->
        <section id="ferramentasHome">

            <div class="barraPesquisa">
                <input
                    type="search"
                    id="pesquisaHome"
                    placeholder="Pesquisar"
                    aria-label="Pesquisar conteúdos"
                >

                <button type="button" aria-label="Pesquisar">
                    <span>⌕</span>
                </button>
            </div>

            <div class="parteFiltro">
                <div class="titleFiltro">
                    <p>MATÉRIAS</p>
                </div>
                <div class="filtrosHome">
                    <button type="button" class="filtroAtivo" data-filtro="tecnicas">
                        Técnicas
                    </button>

                    <button type="button" data-filtro="escolares">
                        Escolares
                    </button>
                </div>
            </div>

        </section>

        <!-- SEÇÕES DE PROVAS E GABARITOS EM PDF -->
        <section class="secaoHome" id="secaoSimulados">
            <div id="simuladosPdfContainer"></div>
        </section>

    </div>

    <!-- FOOTER -->
    <site-footer></site-footer>

</main>

<script src="/components/navBar.js"></script>
<script src="/components/footercomponente.js"></script>
<script src="/scripts/api/simuladosPdf.js"></script>

</body>
</html>

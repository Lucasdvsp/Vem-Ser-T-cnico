<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vem Ser Técnico - Minhas Matérias</title>

    <link rel="stylesheet" href="/css/perfil.css">
    <link rel="stylesheet" href="/css/footer.css">
</head>

<body>

    <!-- CONTEÚDO PRINCIPAL -->
    <main id="telaMaterias">

        <!-- LATERAL DO PERFIL -->
        <aside class="lateralPerfil">

            <!-- FOTO DE PERFIL -->
            <div class="fotoPerfil">
                <img
                    src="/assets/perfilPadrao.png"
                    alt="Foto de perfil"
                    id="fotoUsuario"
                >
            </div>

            <!-- DADOS DO USUÁRIO -->
            <div class="dadosPerfil">

                <h2 id="nomeUsuario">Carregando...</h2>

                <p id="emailUsuario">Carregando...</p>

                <span id="cursoUsuario">
                    Carregando curso...
                </span>

            </div>

            <!-- MENU -->
            <nav class="menuPerfil">

                <a href="#">
                    ♟ Editar perfil
                </a>

                <a href="#">
                    🔒 Alterar senha
                </a>

                <a href="#">
                    ⚙ Configurações
                </a>

                <a href="#" id="btnSair">
                    ⇥ Sair
                </a>

                <a href="#" id="btnExcluirConta" class="excluirConta">
                    🗑 Excluir conta
                </a>

            </nav>

        </aside>

        <!-- CONTEÚDO DAS MATÉRIAS -->
        <section class="conteudoMaterias">

            <!-- CABEÇALHO -->
            <header class="cabecalhoMaterias">

                <div class="instituicao">

                    <h1>Instituição de Interesse</h1>

                    <select id="selectInstituicao">
                        <option value="etec-taboao">
                            Etec de Taboão da Serra
                        </option>
                    </select>

                </div>

                <img
                    src="/asssets/LogoVerm.png"
                    alt="Vem Ser Técnico"
                    class="logoHome"
                >

            </header>

            <!-- TOPO -->
            <div class="topoMaterias">

                <h2>Matérias</h2>

                <div class="filtroMaterias">

                    <p>MATÉRIAS</p>

                    <div class="botoesFiltro">

                        <button
                            type="button"
                            class="filtroAtivo"
                        >
                            Técnicas
                        </button>

                        <button type="button">
                            Escolares
                        </button>

                    </div>

                </div>

            </div>

            <!-- MATÉRIAS EM ANDAMENTO -->
            <section class="secaoMaterias">

                <h3>Em andamento</h3>

                <div class="gradeCards">

                    <article class="cardMateria">

                        <span class="iconeEditar">✎</span>

                        <h4>ALGORITMOS</h4>

                        <p>Nome da Matéria</p>

                        <div class="progresso">

                            <div class="barraProgresso">

                                <span style="width: 55%"></span>

                            </div>

                            <span>55%</span>

                        </div>

                        <button
                            type="button"
                            class="botaoCard"
                        >
                            Continuar
                        </button>

                    </article>

                </div>

            </section>

            <!-- MATÉRIAS CONCLUÍDAS -->
            <section class="secaoMaterias">

                <h3>Concluído</h3>

                <div class="gradeCards">

                    <article class="cardMateria concluido">

                        <span class="iconeEditar">☷</span>

                        <h4>ALGORITMOS</h4>

                        <p>Nome da Matéria</p>

                        <button
                            type="button"
                            class="botaoCard"
                        >
                            Certificado
                        </button>

                    </article>

                </div>

            </section>

        </section>

    </main>

    <!-- FOOTER -->
    <site-footer></site-footer>

    <!-- SCRIPTS -->
    <script src="/components/footercomponente.js"></script>

    <script
        type="module"
        src="/scripts/perfil.js"
    ></script>

</body>

</html>

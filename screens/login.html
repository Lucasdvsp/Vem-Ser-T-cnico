<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vem Ser Técnico - Cadastro</title>
    <link rel="stylesheet" href="/css/login.css">
</head>

<body>

    <main id="telaCadastro">
        <section id="ladoEsquerdoCadastro">
            <img
                src="/asssets/LogoTelaCadastro.png"
                alt="Logo do Website - Vem Ser Técnico"
                id="LogoTelaCadastro"
            >
        </section>

        <section id="ladoDireitoCadastro">
            <div id="containerCadastro">
                <form id="formTelaCadastro">
                    <h2>Acessar a plataforma</h2>
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                    >
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                    >
                    <button type="submit">Entrar</button>
                </form>
                <div id="linksCadastro">
                    <a href="#">Esqueci minha senha</a>
                    <span>Não tem uma conta? <a href="/">Cadastre-se</a></span>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
